<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS 图层专项预览</title>
<style>
@font-face{font-family:FieldSerif;src:url('/fonts/serif.woff')}*{box-sizing:border-box}body{margin:0;background:#e8e5de;color:#303a40;font-family:FieldSerif,SimSun,serif}header{height:64px;display:flex;align-items:center;gap:20px;padding:0 28px;font-size:18px;border-bottom:1px solid #c9c8be}button{font:inherit;border:1px solid #9ca79d;border-radius:3px;background:#f5f1e7;padding:8px 16px;color:inherit;cursor:pointer}#phase{flex:1;max-width:360px}main{display:grid;grid-template-columns:1.2fr 1fr;height:calc(100vh - 64px)}#scene{min-width:0;position:relative}#scene canvas{display:block;width:100%;height:100%}#flat{display:flex;align-items:center;padding:20px;background:#f5f1e7;border-left:1px solid #cccabc}#flat svg{display:block;width:100%;height:auto}
</style></head><body><header><span>GIS 图层专项预览</span><button data-seek="0">图层分离</button><button data-seek="1">空间叠合</button><input id="phase" aria-label="演示进度" type="range" min="0" max="1000" value="0"><output id="value">0.000</output></header><main><div id="scene"></div><div id="flat"></div></main><script type="module" src="./gis-preview.ts"></script></body></html>
